server:
  port: 8081

spring:
  application:
    name: agenda-service
  # Base de datos propia del servicio (Database per Service). En archivo para que sobreviva reinicios.
  datasource:
    url: jdbc:h2:file:./data/agenda
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  grpc:
    server:
      port: 9090
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        # Un mensaje que falla no vuelve a la cola: evita un bucle infinito de reintentos
        default-requeue-rejected: false
  # Saga de cancelación: publica citas.en-cancelacion (outbox) y escucha la respuesta de Triage
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: agenda-service
      auto-offset-reset: earliest
    producer:
      properties:
        # Con Kafka caído, send() no bloquea el poller 60 s (valor por defecto) esperando metadatos
        max.block.ms: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Se registra con su IP y no con el nombre del equipo, que el Gateway a veces no puede resolver
    prefer-ip-address: true
