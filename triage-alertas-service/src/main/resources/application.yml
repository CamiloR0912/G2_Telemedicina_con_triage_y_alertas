server:
  port: 8082

spring:
  application:
    name: triage-alertas-service
  # Base de datos propia del servicio (Database per Service). En archivo: la tabla outbox debe
  # sobrevivir a un reinicio, si no el patrón no garantiza nada.
  datasource:
    url: jdbc:h2:file:./data/triage-alertas
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    # Saga de cancelación: escucha citas.en-cancelacion que publica Agenda
    consumer:
      group-id: triage-alertas-service
      auto-offset-reset: earliest
    producer:
      properties:
        # Con Kafka caído, send() no bloquea el poller 60 s (valor por defecto) esperando metadatos
        max.block.ms: 5000
  rabbitmq:
    host: localhost
    port: 5672
    connection-timeout: 3s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Se registra con su IP y no con el nombre del equipo, que el Gateway a veces no puede resolver
    prefer-ip-address: true
